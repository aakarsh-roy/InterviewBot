<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Interview Preparation Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🤖 Advanced Interview Preparation Bot</h1>
        
        {% if session_progress > 0 %}
        <div class="progress-section">
            <h3>📊 Session Progress</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">Questions:</span>
                    <span class="stat-value">{{ session_progress }}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Avg Score:</span>
                    <span class="stat-value">{{ "%.1f"|format(avg_score) }}/10</span>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: {{ (avg_score * 10)|int }}%;"></div>
            </div>
        </div>
        {% endif %}
        
        <form action="/ask_question" method="POST" id="question-form">
            <label for="tech_stack">Select Tech Stack:</label>
            <select name="tech_stack" id="tech_stack">
                <option value="Python" {% if tech_stack == 'Python' %}selected{% endif %}>Python</option>
                <option value="JavaScript" {% if tech_stack == 'JavaScript' %}selected{% endif %}>JavaScript</option>
                <option value="Java" {% if tech_stack == 'Java' %}selected{% endif %}>Java</option>
                <option value="C++" {% if tech_stack == 'C++' %}selected{% endif %}>C++</option>
                <option value="React" {% if tech_stack == 'React' %}selected{% endif %}>React</option>
                <option value="Node.js" {% if tech_stack == 'Node.js' %}selected{% endif %}>Node.js</option>
                <option value="Web Development" {% if tech_stack == 'Web Development' %}selected{% endif %}>Web Development</option>
                <option value="Data Science" {% if tech_stack == 'Data Science' %}selected{% endif %}>Data Science</option>
                <option value="Machine Learning" {% if tech_stack == 'Machine Learning' %}selected{% endif %}>Machine Learning</option>
                <option value="DevOps" {% if tech_stack == 'DevOps' %}selected{% endif %}>DevOps</option>
                <option value="System Design" {% if tech_stack == 'System Design' %}selected{% endif %}>System Design</option>
            </select> 

            <label for="difficulty">Select Difficulty Level:</label>
            <select name="difficulty" id="difficulty">
                <option value="easy" {% if difficulty == 'easy' %}selected{% endif %}>Easy</option>
                <option value="medium" {% if difficulty == 'medium' %}selected{% endif %}>Medium</option>
                <option value="hard" {% if difficulty == 'hard' %}selected{% endif %}>Hard</option>
            </select>
            
            <label for="question_type">Question Type:</label>
            <select name="question_type" id="question_type">
                <option value="technical" {% if question_type == 'technical' %}selected{% endif %}>Technical Knowledge</option>
                <option value="coding" {% if question_type == 'coding' %}selected{% endif %}>Coding Challenge</option>
                <option value="behavioral" {% if question_type == 'behavioral' %}selected{% endif %}>Behavioral</option>
                <option value="system_design" {% if question_type == 'system_design' %}selected{% endif %}>System Design</option>
            </select>

            <div class="button-group">
                <button type="submit" class="success-btn">🚀 Start Interview</button>
                <button type="button" onclick="getRandomQuestion()" class="secondary-btn">🎲 Random</button>
                <button type="button" onclick="getQuickTip()" class="secondary-btn">💡 Tip</button>
                <button type="button" onclick="resetSession()" class="danger-btn">🔄 Reset Session</button>
            </div>
        </form>

        <div id="tip-display" style="display: none;" class="feedback-section">
            <h4>💡 Interview Tip</h4>
            <p id="tip-text"></p>
        </div>

        {% if question %}
            <div class="feedback-section question-section">
                <h3>📝 Interview Question:</h3>
                <div class="question">{{ question }}</div>
            </div>
            
            <form action="/give_feedback" method="POST" id="answer-form">
                <label for="answer">Your Answer:</label>
                <textarea name="answer" id="answer" rows="8" placeholder="Type your answer here... Use the hint button if you need help!"></textarea>
                
                <input type="hidden" name="tech_stack" value="{{ tech_stack }}">
                <input type="hidden" name="difficulty" value="{{ difficulty }}">
                <input type="hidden" name="question" value="{{ question }}">
                
                <div class="button-group">
                    <button type="submit" class="success-btn">📋 Get Feedback</button>
                    <button type="button" onclick="getHint()" class="secondary-btn">💭 Need Hint</button>
                    <button type="button" onclick="clearAnswer()" class="secondary-btn">🗑️ Clear</button>
                </div>
            </form>
            
            <div id="hint-display" style="display: none;" class="hint-section">
                <h4>💭 Hint</h4>
                <p id="hint-text"></p>
            </div>
        {% endif %}
    </div>
    
    <script src="{{ url_for('static', filename='main.js') }}"></script>
    <script>
        async function getRandomQuestion() {
            try {
                const response = await fetch('/api/random_question');
                const data = await response.json();
                
                document.getElementById('tech_stack').value = data.tech_stack;
                document.getElementById('difficulty').value = data.difficulty;
                document.getElementById('question_type').value = data.question_type;
                
                // Submit the form to get the question
                document.getElementById('question-form').submit();
            } catch (error) {
                console.error('Error getting random question:', error);
                alert('Error loading random question. Please try again.');
            }
        }

        async function getQuickTip() {
            try {
                const response = await fetch('/api/quick_tip');
                const data = await response.json();
                
                document.getElementById('tip-text').textContent = data.tip;
                document.getElementById('tip-display').style.display = 'block';
                
                setTimeout(() => {
                    document.getElementById('tip-display').style.display = 'none';
                }, 10000);
            } catch (error) {
                console.error('Error getting tip:', error);
            }
        }
        
        async function getHint() {
            try {
                const answer = document.getElementById('answer').value;
                const question = document.querySelector('input[name="question"]').value;
                
                const response = await fetch('/api/get_hint', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question,
                        answer_so_far: answer
                    })
                });
                
                const data = await response.json();
                
                if (data.hint) {
                    document.getElementById('hint-text').textContent = data.hint;
                    document.getElementById('hint-display').style.display = 'block';
                } else {
                    alert('Unable to generate hint. Please try again.');
                }
            } catch (error) {
                console.error('Error getting hint:', error);
                alert('Error loading hint. Please try again.');
            }
        }
        
        async function resetSession() {
            if (confirm('Are you sure you want to reset your session? All progress will be lost.')) {
                try {
                    const response = await fetch('/reset_session', {
                        method: 'POST'
                    });
                    const data = await response.json();
                    
                    if (data.status === 'success') {
                        alert('Session reset successfully!');
                        window.location.href = '/';
                    }
                } catch (error) {
                    console.error('Error resetting session:', error);
                    alert('Error resetting session. Please try again.');
                }
            }
        }

        function clearAnswer() {
            document.getElementById('answer').value = '';
            localStorage.removeItem('interview_answer');
            document.getElementById('hint-display').style.display = 'none';
        }
    </script>
</body>
</html>
